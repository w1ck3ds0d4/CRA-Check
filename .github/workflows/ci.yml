name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pytest

      - name: Lint the report generator compiles
        run: python -m py_compile cra_report.py

      - name: Unit + end-to-end tests
        run: pytest -q
